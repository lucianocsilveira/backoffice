<div class="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-900 px-4 transition-colors duration-300">

  <!-- Controles flutuantes (idioma + tema) -->
  <div class="fixed top-4 right-4 flex items-center gap-2">

    <!-- Seletor de idioma -->
    <div class="flex items-center rounded-full ring-1 ring-slate-200 dark:ring-slate-700 bg-white dark:bg-slate-800 shadow-sm overflow-hidden">
      @for (lang of langService.available; track lang.code) {
        <button
          type="button"
          (click)="langService.setLang(lang.code)"
          [title]="lang.label"
          class="flex items-center gap-1.5 px-3 py-2 text-xs font-medium transition-colors duration-150 cursor-pointer"
          [class.bg-blue-600]="langService.currentLang() === lang.code"
          [class.text-white]="langService.currentLang() === lang.code"
          [class.text-slate-500]="langService.currentLang() !== lang.code"
          [class.hover:bg-slate-100]="langService.currentLang() !== lang.code"
          [class.dark:text-slate-400]="langService.currentLang() !== lang.code"
          [class.dark:hover:bg-slate-700]="langService.currentLang() !== lang.code"
        >
          <span>{{ lang.flag }}</span>
          <span class="hidden sm:inline">{{ lang.label }}</span>
        </button>
      }
    </div>

    <!-- Toggle de tema -->
    <button
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="'theme.toggle' | transloco"
      [title]="'theme.toggle' | transloco"
      class="flex items-center gap-2 rounded-full px-3 py-2 text-xs font-medium
             bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300
             ring-1 ring-slate-200 dark:ring-slate-700 shadow-sm cursor-pointer
             hover:bg-slate-50 dark:hover:bg-slate-700 transition-all duration-200"
    >
      @if (themeService.theme() === 'dark') {
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
        <span class="hidden sm:inline">{{ 'theme.light' | transloco }}</span>
      } @else {
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <span class="hidden sm:inline">{{ 'theme.dark' | transloco }}</span>
      }
    </button>
  </div>

  <div class="w-full max-w-sm">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 shadow-lg mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">{{ 'login.title' | transloco }}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">{{ 'login.subtitle' | transloco }}</p>
    </div>

    <!-- Card -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm ring-1 ring-slate-200 dark:ring-slate-700 p-8 transition-colors duration-300">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5">

        <!-- E-mail -->
        <div class="space-y-1.5">
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
            {{ 'login.email' | transloco }}
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            [placeholder]="'login.emailPlaceholder' | transloco"
            class="block w-full rounded-lg border border-slate-300 dark:border-slate-600
                   bg-white dark:bg-slate-900 px-3.5 py-2.5 text-sm
                   text-slate-900 dark:text-slate-100
                   placeholder:text-slate-400 dark:placeholder:text-slate-500
                   outline-none transition
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20
                   disabled:cursor-not-allowed disabled:bg-slate-50 dark:disabled:bg-slate-800"
            [class.border-red-400]="emailErrors"
          />
          @if (emailErrors) {
            <p class="flex items-center gap-1 text-xs text-red-600 dark:text-red-400">
              <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
              </svg>
              {{ 'login.emailError' | transloco }}
            </p>
          }
        </div>

        <!-- Senha -->
        <div class="space-y-1.5">
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
            {{ 'login.password' | transloco }}
          </label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="••••••••"
              class="block w-full rounded-lg border border-slate-300 dark:border-slate-600
                     bg-white dark:bg-slate-900 px-3.5 py-2.5 pr-11 text-sm
                     text-slate-900 dark:text-slate-100
                     placeholder:text-slate-400 dark:placeholder:text-slate-500
                     outline-none transition
                     focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
              [class.border-red-400]="passwordErrors"
            />
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              tabindex="-1"
              [attr.aria-label]="'login.showPassword' | transloco"
              class="cursor-pointer absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors"
            >
              @if (showPassword()) {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              } @else {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              }
            </button>
          </div>
          @if (passwordErrors) {
            <p class="flex items-center gap-1 text-xs text-red-600 dark:text-red-400">
              <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
              </svg>
              {{ 'login.passwordError' | transloco }}
            </p>
          }
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold
                 text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-2
                 focus-visible:outline-offset-2 focus-visible:outline-blue-600 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <svg class="animate-spin w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
            </svg>
            {{ 'login.submitting' | transloco }}
          } @else {
            {{ 'login.submit' | transloco }}
          }
        </button>

      </form>
    </div>

  </div>
</div>
